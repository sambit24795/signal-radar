<!doctype html>
<!-- Template for public/og.png (1200x630). Render with scripts/og.mjs (needs Playwright, not a project dependency). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'EB Garamond';
        src: url('../node_modules/@fontsource/eb-garamond/files/eb-garamond-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('../node_modules/@fontsource/instrument-sans/files/instrument-sans-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2');
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f7f7f4;
        color: #26251e;
        font:
          400 22px/1.4 'Instrument Sans',
          sans-serif;
        position: relative;
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 64px;
        display: flex;
        align-items: center;
        gap: 14px;
        font:
          400 28px/1 'EB Garamond',
          serif;
      }
      .brand img {
        width: 34px;
        height: 34px;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 168px;
        width: 520px;
        font:
          400 76px/0.98 'EB Garamond',
          serif;
        letter-spacing: -0.03em;
      }
      .sub {
        position: absolute;
        left: 72px;
        bottom: 64px;
        width: 500px;
        font:
          400 17px/1.55 'JetBrains Mono',
          monospace;
        color: #6a6963;
      }
      .shot {
        position: absolute;
        left: 650px;
        top: 72px;
        width: 640px;
        height: 640px;
        border: 1px solid #cdcdc9;
        border-radius: 4px;
        background: #f7f7f4 url('../public/marketing/read-light.webp') top left / 640px auto
          no-repeat;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../public/icons/mark.svg" alt="" />Signal Radar</div>
    <h1>Find the story before the algorithm does.</h1>
    <p class="sub">A ranked radar of what is moving in your niches.</p>
    <div class="shot"></div>
  </body>
</html>
